<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For Nyein — Video Maker</title>
<style>
  :root{--bg:#10131a;--card:#181d28;--line:#2a3142;--tx:#e8ecf5;--mut:#8894ad;--ac:#5b9dff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Noto Sans Myanmar","Padauk",sans-serif}
  header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line)}
  main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;padding:14px}
  @media(max-width:900px){main{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
  button,select,input,textarea{font:inherit;color:var(--tx);background:#0e121a;border:1px solid var(--line);border-radius:6px;padding:6px 10px}
  input[type=color]{padding:0;width:34px;height:30px}
  button{cursor:pointer}button:hover{border-color:var(--ac)}button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
  button.rec{background:#c0392b;border-color:#c0392b;color:#fff}
  canvas{width:100%;display:block;background:#000;border-radius:6px}
  textarea{width:100%;height:130px;font-size:16px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .mut{color:var(--mut);font-size:13px}
  #list{max-height:340px;overflow:auto;margin-top:8px}
  .sub{display:grid;grid-template-columns:28px 1fr 78px 78px;gap:6px;margin-bottom:6px;align-items:center;padding:2px;border-radius:6px}
  .sub.sel{background:#243049}
  .sub input{width:100%;padding:4px 6px}
  progress{width:200px}
  kbd{background:#0e121a;border:1px solid var(--line);border-radius:4px;padding:0 5px}
</style>
</head>
<body>
<header>
  <b>For Nyein</b>
  <select id="size"></select>
  <label class="mut">အသံ/Video: <input id="file" type="file" accept="audio/*,video/*"></label>
  <button id="saveJson">Project export</button>
  <label class="mut">import: <input id="loadJson" type="file" accept=".json"></label>
  <span class="mut" id="status"></span>
</header>
<main>
  <section>
    <div class="card">
      <canvas id="cv"></canvas>
      <div class="row">
        <button id="play">▶ Play</button>
        <span class="mut" id="time">0.00 / 0.00</span>
        <button id="export" class="pri">MP4 ထုတ်မယ်</button>
        <button id="cancel" hidden>Cancel</button>
        <progress id="prog" value="0" max="1" hidden></progress>
      </div>
      <canvas id="wf" width="1000" height="200" style="margin-top:10px;touch-action:none"></canvas>
    </div>
    <div class="card" style="margin-top:14px">
      <b>Timeline ကိရိယာ</b>
      <div class="row">
        <button id="tap">⏺ Tap-sync</button>
        <button id="aud">▶ ဒီစာကြောင်း (အရင်/နောက် ၀.၃s)</button>
        <button id="bSplit">Split (S)</button><button id="bMerge">Merge (M)</button><button id="bDel">ဖျက် (Del)</button>
        <button id="bUndo">Undo</button><button id="bRedo">Redo</button>
      </div>
      <div class="row mut">
        စော ပြမယ့် ms <input id="lead" type="number" value="100" style="width:70px">
        ကြာထားမယ့် ms <input id="tail" type="number" value="200" style="width:70px">
        Preview ချိန်ညှိ ms <input id="calib" type="number" value="0" style="width:70px">
      </div>
    </div>
  </section>
  <section>
    <div class="card">
      <b>စာသား (ကဗျာ)</b>
      <textarea id="txt" placeholder="ကဗျာစာသား paste လုပ်ပါ။ စာကြောင်း ၂ ကြောင်းအထက်ရှိရင် တစ်ကြောင်း=တစ်တန်း၊ မရှိရင် ။ ၊ နဲ့ ခွဲပါမယ်။"></textarea>
      <div class="row">
        <button id="split">စာတန်းခွဲမယ်</button>
      </div>
      <div class="row">
        Font <input id="font" size="16">
        အရွယ် % <input id="fsz" type="number" min="2" max="20" step="0.5" style="width:70px">
        အမြင့် % <input id="ypos" type="number" min="10" max="95" step="1" style="width:70px">
      </div>
      <div class="row" id="extra"></div>
    </div>
    <div class="card" style="margin-top:14px">
      <b>စာတန်းများ</b> <span class="mut" id="cnt"></span>
      <div id="list"></div>
    </div>
  </section>
</main>

<script type="module">
import { Output, Mp4OutputFormat, BufferTarget, CanvasSource, AudioBufferSource, QUALITY_HIGH }
  from 'https://cdn.jsdelivr.net/npm/mediabunny@1/+esm';

const $ = (id) => document.getElementById(id);
const FPS = 30;
const SIZES = {
  '16:9 · 1280×720': [1280, 720], '16:9 · 1920×1080': [1920, 1080],
  '9:16 · 720×1280': [720, 1280], '9:16 · 1080×1920': [1080, 1920],
  '1:1 · 720×720': [720, 720], '1:1 · 1080×1080': [1080, 1080],
};
const defaults = () => ({
  version: 1, output: { size: '16:9 · 1280×720', fps: FPS },
  media: { main: null }, audioOffset: 0, followSubs: true, keep: null, keepRaw: 0, calibMs: 0, leadMs: 100, tailMs: 200,
  style: { font: 'Noto Sans Myanmar', sizePct: 6, yPct: 80 },
  subtitles: [],
});
let P = defaults();                     // a NEW session always starts empty (the previous project is offered, never loaded by itself)
let audio = null;                       // main AudioBuffer = rawAudio with the cut-out parts removed (P.keep)
let rawAudio = null;                    // main voice exactly as decoded
const ac = new AudioContext({ sampleRate: 48000 });
const cv = $('cv'), cx = cv.getContext('2d'), wf = $('wf'), wx = wf.getContext('2d');
const setStatus = (s) => { $('status').textContent = s; };
const r2 = (x) => Math.round(x * 100) / 100;

// ---------- main voice = raw buffer minus the removed ranges (P.keep = [[rawStart, rawEnd], ...] that are KEPT) ----------
function buildEdited(raw, keep) {
  if (!keep || !keep.length) return raw;
  const sr = raw.sampleRate, ch = raw.numberOfChannels; let n = 0;
  for (const [a, b] of keep) n += Math.max(0, Math.round((b - a) * sr));
  const out = new AudioBuffer({ length: Math.max(1, n), sampleRate: sr, numberOfChannels: ch }); let pos = 0;
  for (const [a, b] of keep) {
    const i0 = Math.round(a * sr), len = Math.max(0, Math.round((b - a) * sr));
    for (let c = 0; c < ch; c++) out.getChannelData(c).set(raw.getChannelData(c).subarray(i0, i0 + len), pos);
    pos += len;
  }
  return out;
}
function rebuildAudio() { if (!rawAudio) return; audio = buildEdited(rawAudio, P.keep); bpKey = ''; }
// edited-time -> raw-time (a main VIDEO would need this; cutting is disabled for video inputs)
const rawTime = (te) => { if (!P.keep || !P.keep.length) return te; let pos = 0; for (const [a, b] of P.keep) { if (te <= pos + (b - a)) return a + (te - pos); pos += b - a; } return te; };

// ---------- IndexedDB autosave (project JSON only) ----------
const dbp = new Promise((res, rej) => {
  const r = indexedDB.open('fornyein', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('kv');
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
const kvSet = async (k, v) => { const d = await dbp; return new Promise((res, rej) => {
  const tx = d.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k);
  tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); };
const kvGet = async (k) => { const d = await dbp; return new Promise((res, rej) => {
  const q = d.transaction('kv').objectStore('kv').get(k);
  q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); };
let saveTimer, lastSaved = null, prevKept = false;     // lastSaved = the project from the previous session (offered, not loaded)
const save = () => { clearTimeout(saveTimer); saveTimer = setTimeout(async () => {
  try { if (!prevKept && lastSaved) await kvSet('project_prev', lastSaved); prevKept = true; await kvSet('project', P); setStatus('autosave ✓'); }
  catch { setStatus('autosave မရ'); } }, 500); };
function restoreLast() {
  if (!lastSaved) return;
  P = { ...defaults(), ...lastSaved }; lastSaved = null; hist = []; fut = []; sel = -1; audio = null; rawAudio = null; FN.mark = null; applyUI(); save();
  setStatus('ပြီးခဲ့တဲ့ project ပြန်ယူပြီး (အသံဖိုင်ကို ပြန်ရွေးပါ)');
}

// ---------- Undo / Redo (snapshots of subtitles + voice offset + voice cuts) ----------
let hist = [], fut = [], sel = -1;
const snapState = () => JSON.stringify({ s: P.subtitles, o: P.audioOffset || 0, k: P.keep || null });
const applyState = (js) => { const st = JSON.parse(js); P.subtitles = st.s; P.audioOffset = st.o; P.keep = st.k; rebuildAudio(); };
const snap = () => { hist.push(snapState()); if (hist.length > 100) hist.shift(); fut = []; };
function undo() { if (!hist.length) return; fut.push(snapState()); applyState(hist.pop()); sel = -1; changed(); }
function redo() { if (!fut.length) return; hist.push(snapState()); applyState(fut.pop()); sel = -1; changed(); }
const changed = () => { renderList(); save(); redraw(); };

// ---------- Myanmar helpers ----------
function syllables(str) {
  const cs = [...str], out = []; let cur = '';
  const isCons = (c) => /[\u1000-\u1021\u1023-\u1027\u1029\u102A\u103F\u104E]/.test(c);
  for (let i = 0; i < cs.length; i++) {
    const c = cs[i], next = cs[i + 1], prev = cs[i - 1];
    if (cur && isCons(c) && next !== '\u103A' && next !== '\u1039' && prev !== '\u1039') { out.push(cur); cur = ''; }
    cur += c;
  }
  if (cur) out.push(cur); return out;
}
const weight = (s) => Math.max(1, syllables(s.replace(/[\s၊။]/g, '')).length);
const seg = new Intl.Segmenter('my', { granularity: 'word' });
function wrap(c, text, maxW) {
  const lines = [];
  for (const para of text.split('\n')) {
    let cur = '';
    for (const { segment } of seg.segment(para)) {
      if (cur && c.measureText(cur + segment).width > maxW) { lines.push(cur.trim()); cur = segment.trimStart(); }
      else cur += segment;
    }
    lines.push(cur.trim());
  }
  return lines.filter(Boolean);
}

// ---------- hooks for modules in /ext (window.FN) ----------
const FN = window.FN = {
  get P() { return P; }, get audio() { return audio; }, get rawAudio() { return rawAudio; }, ac, cv, wrap, syllables, setStatus,
  redraw: () => redraw(), save: () => save(), changed: () => changed(), snap: () => snap(),
  rebuildAudio: () => { rebuildAudio(); }, nowT: () => nowT(), play: (a, b) => play(a, b), rawTime,
  get hasLast() { return !!lastSaved; }, restoreLast: () => restoreLast(),
  duration: () => duration(),
  get view() { return view; }, zoomBy: (f) => zoomBy(f), zoomFit: () => fitView(), setPps: (p) => setPps(p),   // timeline zoom (pixels per second)
  mark: null,            // {a, b} timeline range selected for cutting (drawn on the voice lane)
  info: { video: null, music: null },   // set by modules for the timeline lanes: {name, dur, isMain?}
  drawSubtitle: null,    // (ctx, W, H, subtitle, t) — replaces the subtitle renderer
  drawBackground: null,  // (ctx, W, H, t) — background / logo, called every frame before subtitles
  beforeFrame: null,     // async (t) — awaited before each exported frame (e.g. video BG decode)
  mixExport: null,       // async (mainAudioBuffer, offsetSeconds, totalSeconds) => AudioBuffer — final mix for export
  onPlay: [], onPause: [], // callbacks: onPlay(startPos) / onPause()
};

// ---------- the ONE draw function (preview = export) ----------
function defaultSubtitle(c, W, H, s) {
  const fs = Math.round(H * P.style.sizePct / 100);
  c.font = `${fs}px "${P.style.font}", sans-serif`;
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
  c.lineWidth = fs / 7; c.strokeStyle = '#000'; c.fillStyle = '#fff';
  const lines = wrap(c, s.text, W * 0.86), lh = fs * 1.5;
  const y0 = H * P.style.yPct / 100 - ((lines.length - 1) * lh) / 2;
  lines.forEach((l, i) => { c.strokeText(l, W / 2, y0 + i * lh); c.fillText(l, W / 2, y0 + i * lh); });
}
function drawFrame(c, W, H, t) {
  c.fillStyle = '#10131a'; c.fillRect(0, 0, W, H);
  if (FN.drawBackground) FN.drawBackground(c, W, H, t);
  const s = P.subtitles.find((x) => t >= x.start && t < x.end);
  if (s) (FN.drawSubtitle || defaultSubtitle)(c, W, H, s, t);
}
// timeline length = where the main voice starts + its length
const duration = () => audio ? (P.audioOffset || 0) + audio.duration : Math.max(10, ...P.subtitles.map((s) => s.end));

// ---------- playback (audio clock is master) ----------
let playing = false, src = null, startAC = 0, startPos = 0, tpos = 0, rangeEnd = null;
const nowT = () => playing ? startPos + (ac.currentTime - startAC) : tpos;
function play(from, to) {
  if (!audio) { setStatus('အသံဖိုင် အရင်ရွေးပါ'); return; }
  if (playing) pause();
  ac.resume(); if (from !== undefined) tpos = Math.max(0, from);
  if (tpos >= duration() - 0.05) tpos = 0;
  rangeEnd = to ?? null;
  const ta = tpos - (P.audioOffset || 0);                      // position inside the voice file (negative = voice starts later)
  src = ac.createBufferSource(); src.buffer = audio; src.connect(ac.destination);
  if (ta >= 0) src.start(0, ta); else src.start(ac.currentTime - ta);
  startAC = ac.currentTime; startPos = tpos; playing = true;
  FN.onPlay.forEach((f) => f(startPos));
  $('play').textContent = '⏸ Pause'; loop();
}
function pause() {
  if (!playing) return; FN.onPause.forEach((f) => f()); tpos = nowT(); playing = false;
  src.onended = null; try { src.stop(); } catch {} $('play').textContent = '▶ Play';
}
function seek(t) { const was = playing; pause(); tpos = Math.max(0, Math.min(t, duration())); if (was) play(); showHead(tpos); redraw(); }
// ---- Tap-sync (hold T while a line is being read) ----
let tapMode = false, tapIdx = 0, tapHeld = false;
function loop() {
  if (!playing) return;
  const t = nowT();
  if (t >= duration() || (rangeEnd !== null && t >= rangeEnd)) { pause(); if (rangeEnd === null) tpos = 0; rangeEnd = null; endTap(); }
  if (tapHeld) { const s = P.subtitles[tapIdx]; if (s) s.end = r2(Math.max(s.start + 0.1, t + P.tailMs / 1000)); }
  if (!drag && performance.now() - lastScroll > 2500) { const px = X(t); if (px > wf.width - 40) { view.t0 = t - 0.12 * plotW() / view.pps; clampView(); } }   // the timeline follows the playhead
  redraw(); if (playing) requestAnimationFrame(loop);
}
function endTap() { if (tapMode) { tapMode = false; tapHeld = false; $('tap').classList.remove('rec'); $('tap').textContent = '⏺ Tap-sync'; renderList(); save(); } }
$('tap').onclick = () => {
  if (tapMode) { endTap(); pause(); return; }
  if (!audio || !P.subtitles.length) { setStatus('အသံဖိုင်နဲ့ စာတန်း အရင်လိုပါတယ်'); return; }
  snap(); tapMode = true; tapIdx = 0; tapHeld = false; $('tap').classList.add('rec'); $('tap').textContent = '⏹ Tap-sync ရပ်'; play(0);
};
function tapDown() {
  if (!tapMode || !playing || tapHeld || tapIdx >= P.subtitles.length) return;
  const s = P.subtitles[tapIdx], t = nowT(); tapHeld = true;
  s.start = r2(Math.max(0, t - P.leadMs / 1000)); s.end = r2(s.start + 0.2);
  const p = P.subtitles[tapIdx - 1]; if (p && p.end > s.start) p.end = r2(Math.max(p.start + 0.05, s.start - 0.02));
}
function tapUp() {
  if (!tapHeld) return; tapHeld = false;
  const s = P.subtitles[tapIdx], t = nowT(); s.end = r2(Math.max(s.start + 0.1, t + P.tailMs / 1000));
  tapIdx++; sel = tapIdx - 1; renderList();
  if (tapIdx >= P.subtitles.length) { endTap(); setStatus('Tap-sync ပြီး — ပြီးမှ waveform ပေါ်မှာ ပြင်ပါ'); }
}

function redraw() {
  const [W, H] = SIZES[P.output.size];
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  const t = nowT(), lat = playing ? (ac.outputLatency || 0) : 0;   // preview-only latency compensation
  drawFrame(cx, W, H, Math.max(0, t - lat - P.calibMs / 1000));
  $('time').textContent = `${t.toFixed(2)} / ${duration().toFixed(2)}`;
  drawWave(t);
}

// ================= TIMELINE (CapCut style): zoom + horizontal scroll, track names on the left =================
const GUT = 88;                                          // left gutter with the track names
const view = { pps: 30, t0: 0 };                         // pixels per second · time at the left edge of the plot
let lastScroll = 0, snapLine = null;
const plotW = () => Math.max(60, wf.width - GUT);
const minPps = () => plotW() / (duration() + 6);         // zoomed all the way out = the whole project is visible
const maxT0 = () => Math.max(0, duration() + 6 - plotW() / view.pps);
function clampView() { view.pps = Math.min(900, Math.max(minPps(), view.pps)); view.t0 = Math.min(maxT0(), Math.max(0, view.t0)); }
const X = (s) => GUT + (s - view.t0) * view.pps, T = (x) => view.t0 + (x - GUT) / view.pps;
function setPps(p, anchor) { const a = anchor ?? T(GUT + plotW() / 2), x = X(a); view.pps = p; clampView(); view.t0 = a - (x - GUT) / view.pps; clampView(); redraw(); }
function zoomBy(f) { const t = nowT(), vis = t >= view.t0 && t <= T(wf.width); setPps(view.pps * f, vis ? t : undefined); }
function fitView() { view.pps = minPps(); view.t0 = 0; clampView(); redraw(); }
function showHead(t) { const px = X(t); if (px < GUT || px > wf.width - 20) { view.t0 = t - 0.15 * plotW() / view.pps; clampView(); } }

const LH = { ruler: 22, video: 30, subs: 34, music: 28, gap: 4, vocalMin: 44 };
function lanes(h) {
  const o = {}; let y = 0;
  o.ruler = [y, LH.ruler]; y += LH.ruler + LH.gap;
  o.video = [y, LH.video]; y += LH.video + LH.gap;
  const voc = Math.max(LH.vocalMin, h - (LH.ruler + LH.video + LH.subs + LH.music + LH.gap * 4));
  o.vocal = [y, voc]; y += voc + LH.gap;
  o.subs = [y, LH.subs]; y += LH.subs + LH.gap;
  o.music = [y, LH.music];
  return o;
}
// waveform: 100 peak values per second, computed once per voice buffer
let bpKey = '', bpVal = null, bpGain = 1;
function basePeaks() {
  if (!audio) return null;
  const key = audio.length + '|' + audio.sampleRate; if (key === bpKey) return bpVal;
  const d = audio.getChannelData(0), win = Math.floor(audio.sampleRate / 100), n = Math.ceil(audio.duration * 100), out = new Float32Array(n); let mx = 0;
  for (let i = 0; i < n; i++) { let m = 0; const s1 = Math.min(d.length, (i + 1) * win); for (let j = i * win; j < s1; j += 3) { const v = Math.abs(d[j]); if (v > m) m = v; } out[i] = m; if (m > mx) mx = m; }
  bpKey = key; bpVal = out; bpGain = 0.95 / Math.max(0.05, mx); return out;
}
function rr(x, y, w, h, r, fill) { wx.fillStyle = fill; wx.beginPath(); if (wx.roundRect) wx.roundRect(x, y, Math.max(1, w), h, r); else wx.rect(x, y, Math.max(1, w), h); wx.fill(); }
const MM = '"Noto Sans Myanmar", system-ui';
function clipText(s, x, y, x0, x1, color, font) {
  const a = Math.max(x0, GUT); if (x1 - a < 10) return;
  wx.save(); wx.beginPath(); wx.rect(a, y - 15, x1 - a, 22); wx.clip(); wx.fillStyle = color || '#dfe6f5'; wx.font = font || `11px ${MM}`; wx.fillText(s, Math.max(x, GUT + 5), y); wx.restore();
}
function drawWave(t) {
  const w = wf.width, h = wf.height; clampView();
  wx.fillStyle = '#0b0e14'; wx.fillRect(0, 0, w, h);
  const ln = lanes(h), D = duration(), off = P.audioOffset || 0, info = FN.info || {}, v1 = T(w);
  wx.save(); wx.beginPath(); wx.rect(GUT, 0, w - GUT, h); wx.clip();
  for (const k of ['video', 'vocal', 'subs', 'music']) { wx.fillStyle = '#10151f'; wx.fillRect(GUT, ln[k][0], w - GUT, ln[k][1]); }
  const xe = X(D); if (xe < w) { wx.fillStyle = 'rgba(0,0,0,.4)'; wx.fillRect(Math.max(GUT, xe), 0, w, h); }       // empty area after the end
  // ruler
  const [ry, rh] = ln.ruler; wx.fillStyle = '#0e121a'; wx.fillRect(GUT, ry, w - GUT, rh);
  const stp = [0.1, 0.2, 0.5, 1, 2, 5, 10, 15, 30, 60, 120, 300, 600].find((s) => s * view.pps >= 90) || 600;
  wx.font = '10px system-ui';
  for (let i = Math.floor(view.t0 / stp); i * stp <= v1; i++) {
    const s = i * stp, x = X(s), m = Math.floor(s / 60), sec = s - m * 60;
    wx.fillStyle = '#5a6683'; wx.fillRect(x, ry + rh - 9, 1, 9); wx.fillStyle = '#8b96b0';
    wx.fillText(stp < 1 ? `${m}:${sec.toFixed(1).padStart(4, '0')}` : `${m}:${String(Math.floor(sec)).padStart(2, '0')}`, x + 3, ry + 11);
    for (let k = 1; k < 5; k++) { wx.fillStyle = '#39425a'; wx.fillRect(X(s + stp * k / 5), ry + rh - 4, 1, 4); }
  }
  // video / background lane
  const [vy, vh] = ln.video;
  if (info.video) {
    const a = info.video.isMain ? off : 0, b = info.video.isMain ? off + (info.video.dur || (audio ? audio.duration : D)) : D;

// ---------- keyboard ----------
const typing = (e) => /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && !typing(e)) {
    if (e.code === 'KeyZ') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if (e.code === 'KeyY') { e.preventDefault(); redo(); }
    else if (e.code === 'KeyS') { e.preventDefault(); $('saveJson').click(); }
    return;
  }
  if (typing(e)) return;
  if (e.code === 'Space') { e.preventDefault(); $('play').click(); }
  else if (e.code === 'KeyT') { e.preventDefault(); if (!e.repeat) tapDown(); }
  else if (e.code === 'KeyA') audition();
  else if (e.code === 'KeyS') splitAt();
  else if (e.code === 'KeyM') mergeNext();
  else if (e.code === 'Delete') delSel();
  else if (e.code === 'Equal' || e.code === 'NumpadAdd') zoomBy(1.4);
  else if (e.code === 'Minus' || e.code === 'NumpadSubtract') zoomBy(1 / 1.4);
  else if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') {
    e.preventDefault(); const dir = e.code === 'ArrowLeft' ? -1 : 1, step = e.shiftKey ? 0.1 : 0.01, s = P.subtitles[sel];
    if (!s) { seek(nowT() + dir * 1); return; } snap();
    if (e.altKey) s.end = r2(Math.max(s.start + 0.05, s.end + dir * step)); else s.start = r2(Math.max(0, Math.min(s.end - 0.05, s.start + dir * step)));
    syncRow(sel); save(); redraw();
  }
});
document.addEventListener('keyup', (e) => { if (e.code === 'KeyT') tapUp(); });

// ---------- boot: always start with an EMPTY project; the last session's project is only offered (FN.hasLast / FN.restoreLast) ----------
(async () => {
  try { const s = await kvGet('project'); if (s && ((s.subtitles && s.subtitles.length) || (s.media && s.media.main))) lastSaved = s; } catch {}
  try { await document.fonts.load(`40px "${P.style.font}"`, 'မြန်မာ'); } catch {}
  applyUI(); setStatus(lastSaved ? 'Project အသစ် — ပြီးခဲ့တဲ့ project ကို ပြန်ယူလို့ရပါတယ်' : '');
  try { await import('/ext/style.js'); } catch (e) { console.warn('ext/style.js', e); setStatus('style module မတင်နိုင်ပါ: ' + e.message); } })();
</script>
</body>
</html>
