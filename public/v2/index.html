<!doctype html>
<html lang="my" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For Nyein</title>
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./editor.css">
</head>
<body>
<div id="app"></div>
<noscript>JavaScript လိုအပ်ပါတယ်</noscript>
<div id="boot-error" hidden></div>
<script>
  // show start-up errors on the page (there is no console on every device)
  window.addEventListener('error', (e) => { const b = document.getElementById('boot-error'); b.hidden = false; b.textContent += (e.message || e) + '\n'; });
  window.addEventListener('unhandledrejection', (e) => { const b = document.getElementById('boot-error'); b.hidden = false; b.textContent += ((e.reason && e.reason.message) || e.reason) + '\n'; });
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
